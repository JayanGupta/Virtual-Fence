version: '3.8'

services:
  virtual-fence:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - virtual_fence_storage:/app/backend/storage
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
      - DEBUG=false
    # To use host cameras, you may need to map devices on Linux
    # devices:
    #   - /dev/video0:/dev/video0

volumes:
  virtual_fence_storage:
    name: virtual_fence_data
